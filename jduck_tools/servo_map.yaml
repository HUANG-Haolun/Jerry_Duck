# 关节名 -> 舵机 ID（你贴在舵机上的编号）。
# 下面是按 microduck 关节顺序的默认猜测，**不一定是你的实际接法**。
# 用 `python3 calibrate.py monitor` 卸力后逐个掰关节，看哪个 ID 的读数在变，再改这里。
servo_ids:
  left_hip_yaw: 1
  left_hip_roll: 2
  left_hip_pitch: 3
  left_knee: 4
  left_ankle: 5
  neck_pitch: 6
  head_pitch: 7
  head_yaw: 8
  head_roll: 9
  right_hip_yaw: 10
  right_hip_roll: 11
  right_hip_pitch: 12
  right_knee: 13
  right_ankle: 14
